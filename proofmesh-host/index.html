// Capture only a saved version 1, never a later version or a replacement template.
function recordSnapshot(p){return {id:p.id,version:p.version,title:p.title,claim:p.claim,boundary:p.boundary,materials:clone(p.materials||[]),lastCheck:p.lastCheck?clone(p.lastCheck):null,createdAt:p.createdAt||null,updatedAt:p.updatedAt||null}}
function usableSnapshot(c){return c&&Number.isInteger(c.version)&&c.version>=1&&typeof c.title==='string'&&typeof c.claim==='string'&&typeof c.boundary==='string'&&Array.isArray(c.materials)&&c.materials.every(function(m){return m&&typeof m.id==='string'&&typeof m.title==='string'&&typeof m.content==='string'&&['events','counter','note'].indexOf(m.kind)>=0})}
function ensureOriginal(p){
  if(p.originalRecord&&p.originalRecord.format==='proofmesh-original-v1'&&usableSnapshot(p.originalRecord.card)&&p.originalRecord.card.version===1)return;
  var first=(p.history||[]).slice().reverse().find(function(v){return v&&v.version===1&&usableSnapshot(v.card)&&v.card.version===1});
  var c=first?first.card:(p.version===1&&usableSnapshot(p)?p:null);
  p.originalRecord=c?{format:'proofmesh-original-v1',source:first?'saved-history-v1':'saved-current-v1',capturedAt:now(),card:recordSnapshot(c)}:null;
}

  var mats=(c.materials||[]).filter(function(m){return !m.deleted});
  h+=mats.length?mats.map(function(m){return '<details class="material" open><summary>'+esc(m.title)+'<span class="kind">'+kind(m.kind)+'</span></summary><pre>'+esc(m.content)+'</pre></details>'}).join(''):'<p class="hint">В этом снимке материалов нет.</p>';
  return h+'</article>';
}

// Read-only comparison. These functions never save, restore, or run a check.
function comparisonTokens(text){
  return text.match(/\s+|[\p{L}\p{M}\p{N}_]+|[^\s]/gu)||[];
}
function comparisonText(before,after){
  before=String(before);after=String(after);
  if(before===after)return {before:esc(before),after:esc(after),coarse:false};
  // Bound work for imported/large materials; preserve the entire text in fallback.
  if(before.length+after.length>50000)return {before:'<del>'+esc(before)+'</del>',after:'<ins>'+esc(after)+'</ins>',coarse:true};
  var a=comparisonTokens(before),b=comparisonTokens(after),prefix=0,suffix=0;
  while(prefix<a.length&&prefix<b.length&&a[prefix]===b[prefix])prefix++;
  while(suffix<a.length-prefix&&suffix<b.length-prefix&&a[a.length-1-suffix]===b[b.length-1-suffix])suffix++;
  var x=a.slice(prefix,a.length-suffix),y=b.slice(prefix,b.length-suffix);
  var lead=esc(a.slice(0,prefix).join('')),tail=suffix?esc(a.slice(a.length-suffix).join('')):'';
  if((x.length+1)*(y.length+1)>180000){
    return {before:lead+(x.length?'<del>'+esc(x.join(''))+'</del>':'')+tail,after:lead+(y.length?'<ins>'+esc(y.join(''))+'</ins>':'')+tail,coarse:true};
  }
  var rows=x.length+1,cols=y.length+1,table=new Uint32Array(rows*cols),i,j;
  for(i=x.length-1;i>=0;i--)for(j=y.length-1;j>=0;j--){
    table[i*cols+j]=x[i]===y[j]?table[(i+1)*cols+j+1]+1:Math.max(table[(i+1)*cols+j],table[i*cols+j+1]);
  }
  var left=[],right=[],removed=[],added=[];
  function flush(){
    if(removed.length){left.push('<del>'+esc(removed.join(''))+'</del>');removed=[];}
    if(added.length){right.push('<ins>'+esc(added.join(''))+'</ins>');added=[];}
  }
  i=0;j=0;
  while(i<x.length||j<y.length){
    if(i<x.length&&j<y.length&&x[i]===y[j]){flush();left.push(esc(x[i]));right.push(esc(y[j]));i++;j++;}
    else if(i<x.length&&(j===y.length||table[(i+1)*cols+j]>=table[i*cols+j+1]))removed.push(x[i++]);
    else added.push(y[j++]);
  }
  flush();return {before:lead+left.join('')+tail,after:lead+right.join('')+tail,coarse:false};
}
function comparisonRecords(before,after){
  if(!usableSnapshot(before)||!usableSnapshot(after))return {error:'Снимок повреждён: сравнить записи без догадок невозможно.'};
  function uniqueMaterials(c){var seen=new Set();return c.materials.every(function(m){if(seen.has(m.id))return false;seen.add(m.id);return true;});}
  if(!uniqueMaterials(before)||!uniqueMaterials(after))return {error:'В материалах повторяется идентификатор. Сравнение остановлено, чтобы не перепутать источники.'};
  var labels={title:'Название',claim:'Утверждение',boundary:'Граница вывода'};
  var fields=Object.keys(labels).map(function(key){return {key:key,label:labels[key],before:before[key],after:after[key],changed:before[key]!==after[key]};});
  var left=active(before),right=active(after),lm=new Map(),rm=new Map(),ids=[];
  left.forEach(function(m){lm.set(m.id,m);ids.push(m.id);});
  right.forEach(function(m){rm.set(m.id,m);if(!lm.has(m.id))ids.push(m.id);});
  var counts={added:0,removed:0,changed:0,same:0};
  var materials=ids.map(function(id){
    var l=lm.get(id)||null,r=rm.get(id)||null;
    var change=!l?'added':!r?'removed':l.title!==r.title||l.content!==r.content||l.kind!==r.kind?'changed':'same';
    counts[change]++;return {id:id,before:l,after:r,change:change};
  });
  var previousOrder=left.filter(function(m){return rm.has(m.id);}).map(function(m){return m.id;});
  var currentOrder=right.filter(function(m){return lm.has(m.id);}).map(function(m){return m.id;});
  var reordered=JSON.stringify(previousOrder)!==JSON.stringify(currentOrder);
  var fieldsChanged=fields.filter(function(f){return f.changed;}).length;
  return {fields:fields,materials:materials,counts:counts,fieldsChanged:fieldsChanged,reordered:reordered,previousOrder:previousOrder,currentOrder:currentOrder,total:fieldsChanged+counts.added+counts.removed+counts.changed+(reordered?1:0)};
}
function comparisonSide(label,html,side,empty){
  return '<section class="compare-side '+side+'"><h5>'+esc(label)+'</h5>'+(empty?'<p class="compare-empty">'+esc(empty)+'</p>':'<div class="compare-text">'+html+'</div>')+'</section>';
}
function comparisonField(field){
  var d=comparisonText(field.before,field.after);
  var mark=field.changed?'Изменено':'Без изменений';
  return '<details class="compare-block" data-compare-field="'+field.key+'"'+(field.changed?' open':'')+'><summary><span>'+field.label+'</span><span class="compare-tag '+(field.changed?'changed':'same')+'">'+mark+'</span></summary><div class="compare-pair">'+comparisonSide('Было · исходная v1',d.before,'before',field.before===''?'Поле было пустым':null)+comparisonSide('Стало · текущий текст',d.after,'after',field.after===''?'Поле пустое':null)+'</div>'+(d.coarse?'<p class="compare-footnote">Большой изменённый фрагмент выделен целиком. Текст не сокращён.</p>':'')+'</details>';
}
function comparisonMaterial(m){
  var l=m.before,r=m.after,labels={added:'Добавлено',removed:'Удалено',changed:'Изменено',same:'Без изменений'};
  var name=(r||l).title||'Материал без названия';
  var titles=comparisonText(l?l.title:'',r?r.title:'');
  var contents=comparisonText(l?l.content:'',r?r.content:'');
  var kinds=comparisonText(l?kind(l.kind):'',r?kind(r.kind):'');
  function body(card,side){if(!card)return '';return '<div class="compare-material-name">'+titles[side]+'</div><div class="compare-kind">'+kinds[side]+'</div><pre class="compare-content">'+(card.content?contents[side]:'<span class="compare-empty">Содержимое пустое</span>')+'</pre>';}
  return '<details class="compare-block compare-material" data-material-change="'+m.change+'"'+(m.change==='same'?'':' open')+'><summary><span>'+esc(name)+'</span><span class="compare-tag '+m.change+'">'+labels[m.change]+'</span></summary><div class="compare-pair">'+comparisonSide('Было · исходная v1',body(l,'before'),'before',!l?'Этого материала не было':null)+comparisonSide('Стало · текущий набор',body(r,'after'),'after',!r?'Убран из текущей карточки. Исходный материал сохранён в v1.':null)+'</div>'+(contents.coarse?'<p class="compare-footnote">Большой изменённый фрагмент выделен целиком. Текст не сокращён.</p>':'')+'</details>';
}
function comparisonContent(before,current,isDraft){
  var result=comparisonRecords(before,current);
  if(result.error)return '<div class="statusbox warn"><div class="statusline">Сравнение недоступно</div><p>'+esc(result.error)+'</p></div>';
  var c=result.counts;
  var label=isDraft?'Черновик · не сохранён':'Сохранённая v'+current.version;
  var h='<div class="compare-context"><div><span>БЫЛО</span><strong>Исходная запись · v1</strong></div><div><span>СТАЛО</span><strong>'+label+'</strong></div></div>';
  h+='<div class="compare-overview" role="status"><strong>'+(result.total?'Разница с исходной записью':'Изменений пока нет')+'</strong><p>'+(result.total?'Поля: '+result.fieldsChanged+' из 3. Материалы: +'+c.added+' / −'+c.removed+' / изменено '+c.changed+'.':'Название, утверждение, границы и материалы совпадают с v1.')+'</p>';
  if(result.total)h+='<div class="compare-legend"><span class="compare-tag added">＋ Добавлено</span><span class="compare-tag removed">− Удалено</span><span class="compare-tag changed">Изменено</span></div>';
  h+='</div><h3 class="compare-section">Текст карточки</h3>'+result.fields.map(comparisonField).join('');
  h+='<h3 class="compare-section">Материалы <small>'+active(before).length+' → '+active(current).length+'</small></h3><p class="compare-footnote">Материалы сопоставляются по идентификатору. Неизменённые блоки свёрнуты; их можно раскрыть.</p>';
  if(result.reordered){
    var oldMap=new Map();active(before).forEach(function(m){oldMap.set(m.id,m.title);});
    h+='<details class="compare-block"><summary><span>Порядок общих материалов</span><span class="compare-tag changed">Изменено</span></summary><div class="compare-pair">'+comparisonSide('Было',esc(result.previousOrder.map(function(id,i){return (i+1)+'. '+oldMap.get(id);}).join('\n')),'before')+comparisonSide('Стало',esc(result.currentOrder.map(function(id,i){return (i+1)+'. '+oldMap.get(id);}).join('\n')),'after')+'</div></details>';
  }
  h+=result.materials.length?result.materials.map(comparisonMaterial).join(''):'<p class="compare-empty">Материалов нет ни в исходной, ни в текущей записи.</p>';
  return h+'<p class="compare-footnote compare-scope">Это сравнение текста и материалов, не повторная проверка доказательств. Записанные результаты проверок смотрите отдельно в карточке и истории.</p>';
}
function openComparison(p){
  var existing=document.getElementById('comparisonViewer');if(existing)existing.remove();
  var r=parse(),hasDraft=draft&&draftId===p.id&&dirty(p);
  var useDraft=r.screen==='project'&&r.id===p.id&&r.mode==='create'&&hasDraft;
  var current=recordSnapshot(useDraft?draft:p);
  var origin=p.originalRecord&&p.originalRecord.format==='proofmesh-original-v1'&&p.originalRecord.card;
  var usable=origin&&usableSnapshot(origin)&&origin.version===1;
  var detail=useDraft?'Справа показаны несохранённые правки. Открытие окна не сохраняет их.':hasDraft?'Справа показана сохранённая карточка. Несохранённые правки остаются в редакторе.':'Справа показана текущая сохранённая карточка.';
  var contents='<p class="version-readonly"><strong>Только просмотр.</strong> '+esc(detail)+' Исходник не изменяется.</p>';
  if(usable)contents+=comparisonContent(recordSnapshot(origin),current,!!useDraft);
  else contents+='<div class="statusbox warn"><div class="statusline">Исходная v1 не найдена</div><p>В этой копии нет пригодного снимка версии 1. Сравнение недоступно: текущий текст и учебный шаблон не подставляются вместо исходника.</p></div><p class="compare-footnote">Закройте окно и импортируйте JSON-копию, в которой сохранилась v1. Поздняя версия не выдаётся за исходную.</p>';
  var d=document.createElement('dialog');d.id='comparisonViewer';d.className='version-dialog compare-dialog';d.setAttribute('aria-labelledby','comparisonTitle');d.setAttribute('aria-describedby','comparisonSubtitle');
  d.innerHTML='<div class="version-bar"><div><h2 id="comparisonTitle">Что изменилось?</h2><p id="comparisonSubtitle">Было → стало · без редактирования</p></div><button type="button" class="btn small" id="closeComparison">Закрыть</button></div><div class="version-body compare-body">'+contents+'</div>';
  var returnFocus=document.activeElement,previousOverflow=document.body.style.overflow;document.body.appendChild(d);document.body.style.overflow='hidden';
  function close(){d.close();d.remove();document.body.style.overflow=previousOverflow;if(returnFocus&&returnFocus.isConnected)returnFocus.focus({preventScroll:true});}
  d.querySelector('#closeComparison').onclick=close;d.addEventListener('cancel',function(e){e.preventDefault();close();});
  d.showModal();d.querySelector('#closeComparison').focus({preventScroll:true});
}

function bindRecordControls(){
  document.querySelectorAll('[data-compare]').forEach(function(b){b.onclick=function(){var p=find(b.getAttribute('data-compare'));if(p)openComparison(p)}});
  document.querySelectorAll('[data-original]').forEach(function(b){b.onclick=function(){var p=find(b.getAttribute('data-original'));if(p)openRecord(p,'original')}});
  document.querySelectorAll('[data-open-history]').forEach(function(b){b.onclick=function(){var id=b.getAttribute('data-open-history'),r=parse();if(r.screen!=='project'||r.id!==id)nav('project:'+id+':explore');tab='history';render();var target=document.getElementById('projectPanel');if(target)target.scrollIntoView({block:'start'})}});
  document.querySelectorAll('[data-view-version]').forEach(function(b){b.onclick=function(){var p=find(b.getAttribute('data-record-project'));if(p)openRecord(p,b.getAttribute('data-view-version'))}});
}
// Import adds a local copy: it never overwrites another existing research card.
function importProjectText(text){
  var data=JSON.parse(text), p=data&&data.card?data.card:data;
  if(!validProject(p)||!usableSnapshot(p)||!/^[A-Za-z0-9_-]{1,80}$/.test(p.id)||p.history.length>500)throw new Error('Нужна JSON-копия одной карточки ProofMesh 0.3.');
  if(p.history.some(function(v){return !v||!Number.isInteger(v.version)||!usableSnapshot(v.card)||v.card.version!==v.version}))throw new Error('В JSON повреждены записи истории.');
  var out=recordSnapshot(p);out.history=p.history.map(function(v){return {version:v.version,at:typeof v.at==='string'?v.at:null,label:typeof v.label==='string'?v.label:'Импортированный снимок',card:recordSnapshot(v.card)}});
  out.originalRecord=p.originalRecord&&p.originalRecord.format==='proofmesh-original-v1'&&usableSnapshot(p.originalRecord.card)&&p.originalRecord.card.version===1?{format:'proofmesh-original-v1',source:'imported-saved-v1',capturedAt:p.originalRecord.capturedAt||now(),card:recordSnapshot(p.originalRecord.card)}:null;
  ensureOriginal(out);
  while(find(out.id))out.id='pm-'+uid();

}

document.querySelectorAll('[data-mcontent]').forEach(function(i){i.oninput=function(){var m=draft.materials.find(function(x){return x.id===i.getAttribute('data-mcontent')});if(m)m.content=i.value}});

document.querySelectorAll('[data-restorever]').forEach(function(b){b.onclick=function(){var v=p.history[+b.getAttribute('data-restorever')];function apply(){draft=clone(v.card);draft.history=clone(p.history);draft.originalRecord=p.originalRecord?clone(p.originalRecord):null;draft.id=p.id;draftId=p.id;render();show('Версия загружена только в редактор. Сохранённая карточка не изменилась.')}if(!dirty(p)){apply();return}var existing=document.getElementById('restoreDraftChoice');if(existing)existing.remove();var box=document.createElement('div');box.id='restoreDraftChoice';box.className='boundary';box.innerHTML='<h4>В редакторе есть несохранённые правки</h4><p>Загрузка этой версии заменит черновик. Сохранённая карточка останется прежней.</p><div class="toolbar"><button class="btn primary" id="replaceDraft">Заменить черновик</button><button class="btn" id="keepDraft">Оставить правки</button></div>';b.parentNode.after(box);box.querySelector('#replaceDraft').onclick=apply;box.querySelector('#keepDraft').onclick=function(){box.remove()}}});
var saveBtn=document.querySelector('[data-save]');if(saveBtn)saveBtn.onclick=function(){if(!dirty(p)){show('Изменений нет.');return}p=saveVersion(p,'Ручное сохранение правок');render();show(storageOK?'Новая версия сохранена.':'Версия обновлена только в памяти просмотра. Используйте JSON-копию.')};
var checkBtn=document.querySelector('[data-check]');if(checkBtn)checkBtn.onclick=function(){if(r.mode==='create'&&dirty(p))p=saveVersion(p,'Автосохранение перед проверкой');var ix=ws.projects.findIndex(function(x){return x.id===p.id});ws.projects[ix].lastCheck=runCheck(ws.projects[ix]);ws.projects[ix].updatedAt=now();if(r.mode==='create'||!dirty(p)){draft=clone(ws.projects[ix]);draftId=p.id}save();tab='check';show('Учебная проверка: '+meta[status(ws.projects[ix])][0]+'.');render()};
var counterBtn=document.querySelector('[data-counter]');if(counterBtn)counterBtn.onclick=function(){draft.materials.push({id:uid(),kind:'counter',title:'Контрпример: повтор в неоднозначном окне',content:'Трасса X: init, pending, retry, confirmed'});tab='materials';show('Контрпример добавлен. Запустите проверку.');render()};
var discard=document.querySelector('[data-discard]');if(discard)discard.onclick=function(){draft=clone(p);draftId=p.id;show('Несохранённые правки отменены.');render()};
var exp=document.querySelector('[data-export]');if(exp)exp.onclick=function(){download('proofmesh-'+p.id+'.json',JSON.stringify(p,null,2),'application/json')};
var snap=document.querySelector('[data-snapshot]');if(snap)snap.onclick=function(){var existing=document.getElementById('snapshotChoice');if(existing){existing.remove();return}var box=document.createElement('div');box.id='snapshotChoice';box.className='boundary';box.innerHTML='<h4>Материалы в файле для чтения</h4><p>Включить активные материалы в отдельный HTML-файл? История и удалённые материалы не включаются.</p><div class="toolbar"><button class="btn primary" id="includeSnapshot">Включить материалы</button><button class="btn" id="excludeSnapshot">Без материалов</button><button class="btn" id="cancelSnapshot">Отмена</button></div>';snap.parentNode.after(box);document.getElementById('includeSnapshot').onclick=function(){download('proofmesh-'+p.id+'-readonly.html',snapshotHtml(p,true),'text/html');box.remove()};document.getElementById('excludeSnapshot').onclick=function(){download('proofmesh-'+p.id+'-readonly.html',snapshotHtml(p,false),'text/html');box.remove()};document.getElementById('cancelSnapshot').onclick=function(){box.remove()};box.scrollIntoView({block:'center'})};
}}
function render(){var r=parse(),html=r.screen==='home'?home():r.screen==='registry'?registry(r.id):r.screen==='new'?newScreen(r.id):r.screen==='project'?research(r.id,r.mode):home();document.getElementById('app').innerHTML=html;storageLabel();bind()}
window.addEventListener('hashchange',function(){if(suppressHash){suppressHash=false;return}route=(location.hash||'#home').slice(1);tab='materials';render()});
window.addEventListener('beforeunload',function(e){var p=draftId?find(draftId):null;if(p&&dirty(p)){e.preventDefault();e.returnValue=''}});
document.getElementById('importProjectButton').onclick=function(){document.getElementById('importProjectFile').click()};
document.getElementById('importProjectFile').onchange=function(e){var f=e.target.files[0];e.target.value='';if(!f)return;if(f.size>5*1024*1024){show('JSON слишком большой: максимум 5 МБ.');return}f.text().then(function(text){try{importProjectText(text)}catch(err){show(err.message||'Не удалось прочитать JSON-копию.')}}).catch(function(){show('Не удалось прочитать файл.')})};

render();
})();
</script>
