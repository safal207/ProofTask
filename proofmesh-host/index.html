<header class="header"><div class="headerin"><button class="space" data-nav="home" style="padding:0"><span class="brand"><span class="logo"><svg viewBox="0 0 24 24" fill="none"><path d="M4 7l8-4 8 4-8 4-8-4Zm0 5 8 4 8-4M4 17l8 4 8-4" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></span>ProofMesh <span class="alpha">alpha</span></span></button><button class="space" data-nav="home">▣ <span>Личное пространство</span></button></div></header>
<main id="app" class="shell"></main>

<input id="restoreFile" type="file" accept="application/json" class="hidden">
<script>
(function(){
var KEY='proofmesh:workspace:v0.3', OLD='proofmesh:v0.2-static';
var uid=function(){return Math.random().toString(36).slice(2,10)}, now=function(){return new Date().toISOString()}, clone=function(x){return JSON.parse(JSON.stringify(x))};
var tab='materials', draft=null, draftId=null, timer=null;
var meta={notrun:['Проверка ещё не выполнена','Материалы приложены. Самостоятельная проверка пока не выполнена.',''],missing:['Не хватает материала','Нет активного материала с учебными трассами событий.','warn'],stale:['Результат устарел','Утверждение изменилось после последней проверки. Старый результат не переносится на новую версию.','warn'],verified:['Подтверждено в рамках модели','Все приложенные учебные трассы соответствуют правилу. Это ограниченный учебный результат, не общий аудит.','ok'],contradiction:['Обнаружено противоречие','В приложенных материалах найден контрпример: повтор произошёл до закрытия неоднозначного исхода.','bad']};
function seed(){return{id:'pm-001',version:1,title:'Потеря ответа не разрешает повторное списание',claim:'В приложенных учебных трассах после потери ответа повторная отправка блокируется, пока исход первой попытки неизвестен.',boundary:'Только приложенные синтетические трассы одной операции INV-782. Проверка ограничена этой учебной моделью и не является проверкой реального банка, реальных переводов или общим аудитом безопасности.',materials:[{id:uid(),kind:'events',title:'DI · правило восстановления операции',content:'# Синтетические трассы\nТрасса A: init, pending, confirmed, retry\nТрасса B: init, pending, failed, retry\nТрасса C: init, unknown, confirmed\nТрасса D: init, confirmed'},{id:uid(),kind:'note',title:'Как читать модель',content:'pending и unknown означают неоднозначный исход. confirmed и failed закрывают неоднозначность. retry до закрытия считается нарушением.'}],lastCheck:null,history:[],createdAt:now(),updatedAt:now()}}
function migrateOld(x){return{id:'pm-001',version:x.version||1,title:x.title||seed().title,claim:x.claim||seed().claim,boundary:x.boundary||seed().boundary,materials:x.materials||seed().materials,lastCheck:x.lastCheck||null,history:x.history||[],createdAt:now(),updatedAt:now()}}
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r);var old=localStorage.getItem(OLD),p=old?migrateOld(JSON.parse(old)):seed();var w={version:'0.3',projects:[p]};localStorage.setItem(KEY,JSON.stringify(w));return w}catch(e){return{version:'0.3',projects:[seed()]}}}
var ws=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(ws));return true}catch(e){return false}}
function active(p){return(p.materials||[]).filter(function(m){return!m.deleted})}
function status(p){if(!active(p).some(function(m){return m.kind==='events'}))return'missing';if(!p.lastCheck)return'notrun';if((p.lastCheck.claimSnapshot||'').trim()!==p.claim.trim())return'stale';return p.lastCheck.status}
function evaluate(text){var out=[];String(text||'').split('\n').forEach(function(line){line=line.trim();if(!line||line[0]==='#'||line.indexOf(':')<0)return;var a=line.split(':'),name=a.shift().trim(),ev=a.join(':').split(/[,\s]+/).filter(Boolean).map(function(x){return x.toLowerCase()}),amb=false,ok=true;ev.forEach(function(e){if(e==='pending'||e==='unknown')amb=true;else if(e==='confirmed'||e==='failed')amb=false;else if(e==='retry'&&amb)ok=false});out.push({name:name,ok:ok})});return out}
function runCheck(p){var events=active(p).filter(function(m){return m.kind==='events'});if(!events.length)return{at:now(),claimSnapshot:p.claim,status:'missing',traces:[],summary:meta.missing[1]};var traces=[];active(p).filter(function(m){return m.kind==='events'||m.kind==='counter'}).forEach(function(m){evaluate(m.content).forEach(function(t){t.material=m.title;traces.push(t)})});var bad=traces.filter(function(t){return!t.ok});return{at:now(),claimSnapshot:p.claim,status:bad.length?'contradiction':'verified',traces:traces,summary:bad.length?'Найдено нарушений: '+bad.length+'.':'Все учебные трассы ('+traces.length+') соответствуют правилу.'}}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function attr(s){return esc(s).replace(/"/g,'&quot;')}
function show(s){var n=document.getElementById('notice');n.textContent=s;n.classList.remove('hidden');clearTimeout(timer);timer=setTimeout(function(){n.classList.add('hidden')},3200)}
function nav(s){location.hash=s}
function parse(){var h=(location.hash||'#home').slice(1),a=h.split(':');return{screen:a[0]||'home',id:a[1]||'',mode:a[2]||'explore'}}
function find(id){return ws.projects.find(function(p){return p.id===id})}
function kind(k){return k==='events'?'Трассы событий':k==='counter'?'Контрпример':'Заметка'}
function statusPill(p){var s=status(p),m=meta[s];return'<div class="statusbox '+m[2]+'"><div class="statusline"><span class="dot"></span>'+m[0]+'</div><p>'+(p.lastCheck?esc(p.lastCheck.summary):m[1])+'</p></div>'}
function home(){return'<section class="home"><div class="personal">Личное пространство</div><h1 class="home-title">Исследуй идеи.<br>Создавай своё.</h1><p class="home-sub">Материалы и проверки — в одном месте.</p><div class="choice primary"><div class="choice-head"><div class="choice-icon">⌕</div><div><h2>Исследую</h2><p>Смотрю материалы и разбираюсь,<br>на чём основаны выводы.</p></div></div><button class="bigbtn" data-nav="registry">Открыть исследования <span>→</span></button></div><div class="choice"><div class="choice-head"><div class="choice-icon">⊞</div><div><h2>Создаю</h2><p>Собираю проект, добавляю<br>материалы и проверяю результат.</p></div></div><button class="bigbtn" data-nav="new">Создать проект <span>＋</span></button></div><div class="softline"><span>⇄</span> Режим можно сменить в любой момент.</div><button class="examplelink" data-nav="project:pm-001:explore">Посмотреть готовый пример →</button></section>'}
function projectCard(p,sel){return'<article class="project-card '+(sel?'selected':'')+'" data-select="'+p.id+'"><div class="project-top"><span class="tag">'+(p.id==='pm-001'?'DI':'PM')+'</span><span class="openhint">'+meta[status(p)][0]+'</span></div><h3>'+esc(p.title)+'</h3><p>'+esc(p.claim).slice(0,105)+(p.claim.length>105?'…':'')+'</p><div class="project-foot"><span>▱ '+active(p).length+' '+(active(p).length===1?'источник':'материала')+'</span><span>↗</span></div></article>'}
function registry(id){var p=find(id)||ws.projects[0];if(!p)return newScreen();return'<div class="toprow"><div><div class="eyebrow">Утверждения · материалы · проверки</div><h1 class="page-title">Реестр доказательств</h1><p class="page-sub">Каждый вывод сохраняет связь со своими основаниями.</p></div><button class="btn primary" data-nav="new"><span class="plus">＋</span>Добавить утверждение</button></div><div class="registry-tabs"><button class="active">Утверждения <span class="count">'+ws.projects.length+'</span></button><button>Протоколы</button></div><div class="registry-grid"><section><p class="list-title">'+(ws.projects.length===1?'Начните с одного проверяемого утверждения':'Выберите исследование')+'</p>'+ws.projects.map(function(x){return projectCard(x,x.id===p.id)}).join('')+'<div class="softline" style="font-size:14px;margin-left:0">◉ Сильное доказательство можно проверить заново. Сохраняйте метод, контекст и то, чего пока не знаете.</div></section><section class="detail"><div class="row"><span class="eyebrow" style="letter-spacing:.12em">ПРИМЕР ОФОРМЛЕНИЯ</span><span class="pm">'+p.id.toUpperCase()+' · v'+p.version+'</span></div><h2>'+esc(p.title)+'</h2><p class="desc">'+esc(p.claim)+'</p><div class="source-note">ⓘ Источник открыт. Самостоятельная проверка: '+meta[status(p)][0].toLowerCase()+'.</div><div class="boundary"><h4>Граница вывода</h4><p>'+esc(p.boundary)+'</p></div><div class="detail-actions"><button class="btn primary" data-nav="project:'+p.id+':explore">Открыть исследование</button><button class="btn" data-clone="'+p.id+'">＋ Создать по образцу</button></div><div class="mini-tabs"><span class="active">Материалы <span class="count">'+active(p).length+'</span></span><span>Цепочка решения</span><span>История <span class="count">'+p.history.length+'</span></span></div>'+(active(p)[0]?'<div class="material-line"><div class="ic">↗</div><div><b>'+esc(active(p)[0].title)+'</b><small>'+kind(active(p)[0].kind)+'</small><p>'+esc(active(p)[0].content).slice(0,180)+'…</p></div></div>':'<p class="page-sub" style="margin-top:18px">Материалов пока нет.</p>')+'</section></div>'}
function newScreen(prefill){var p=prefill?find(prefill):null;return'<div class="toprow"><div><div class="eyebrow">Новое исследование</div><h1 class="page-title">Создать проект</h1><p class="page-sub">Одно проверяемое утверждение, ясная граница и первое основание.</p></div></div><form id="newForm" class="formcard"><h2>Карточка исследования</h2><p class="sub">Начни с минимума. Остальные материалы можно добавить позже.</p><div class="field"><label>Название</label><input name="title" required value="'+attr(p?p.title+' — копия':'')+'" placeholder="Например: Повтор после timeout запрещён"></div><div class="field"><label>Проверяемое утверждение</label><textarea name="claim" required placeholder="Что именно мы хотим проверить?">'+esc(p?p.claim:'')+'</textarea></div><div class="field"><label>Граница вывода</label><textarea name="boundary" required placeholder="Что эта проверка доказывает — и чего не доказывает?">'+esc(p?p.boundary:'')+'</textarea></div><div class="field"><label>Первый материал</label><input name="materialTitle" value="'+attr(p&&active(p)[0]?active(p)[0].title:'Учебные трассы / источник')+'"><textarea name="materialContent" placeholder="Трасса A: init, pending, confirmed, retry">'+esc(p&&active(p)[0]?active(p)[0].content:'')+'</textarea><small>Для учебной проверки трассы читаются в формате «имя: событие, событие…».</small></div><div class="form-actions"><button type="button" class="btn" data-nav="registry">Отмена</button><button class="btn primary" type="submit">Создать и открыть</button></div></form>'}
function dirty(p){return draft&&p&&JSON.stringify({title:draft.title,claim:draft.claim,boundary:draft.boundary,materials:draft.materials})!==JSON.stringify({title:p.title,claim:p.claim,boundary:p.boundary,materials:p.materials})}
function materialsHtml(p,edit){var h='';if(edit)h+='<div class="toolbar"><button class="btn small" data-add="events">＋ Трассы</button><button class="btn small" data-add="note">＋ Заметка</button></div>';active(p).forEach(function(m){h+='<details class="material"><summary>'+esc(m.title)+'<span class="kind">'+kind(m.kind)+'</span></summary>';if(edit)h+='<input data-mtitle="'+m.id+'" value="'+attr(m.title)+'"><textarea data-mcontent="'+m.id+'">'+esc(m.content)+'</textarea><button class="btn small danger" data-del="'+m.id+'">Удалить материал</button>';else h+='<pre>'+esc(m.content)+'</pre>';h+='</details>'});if(!active(p).length)h='<p class="hint">Материалов нет.</p>'+h;return h}
function checkHtml(p){var h=statusPill(p);if(p.lastCheck&&p.lastCheck.traces)h+='<div class="code">'+p.lastCheck.traces.map(function(t){return(t.ok?'PASS ':'FAIL ')+t.name+' — '+t.material}).join('\n')+'</div>';return h}
function reportHtml(p){return'<div class="code"># '+esc(p.title)+'\n\nУтверждение\n'+esc(p.claim)+'\n\nГраница вывода\n'+esc(p.boundary)+'\n\nРезультат\n'+meta[status(p)][0]+'\n\n'+(p.lastCheck?esc(p.lastCheck.summary):'Проверка ещё не запускалась.')+'</div>'}
function historyHtml(p,edit){if(!p.history.length)return'<p class="hint">История появится после первого сохранения.</p>';return p.history.map(function(v,i){return'<div class="historyitem"><b>v'+v.version+' · '+esc(v.label)+'</b><small>'+new Date(v.at).toLocaleString('ru-RU')+'</small>'+(edit?'<div><button class="btn small" data-restorever="'+i+'">Восстановить эту версию</button></div>':'')+'</div>'}).join('')}
function panel(p,edit){return tab==='materials'?materialsHtml(p,edit):tab==='check'?checkHtml(p):tab==='report'?reportHtml(p):historyHtml(p,edit)}
function research(id,mode){var p=find(id);if(!p)return registry();if(mode==='create'&&(draftId!==id||!draft)){draft=clone(p);draftId=id}var v=mode==='create'?draft:p,s=meta[status(p)];return'<section class="cardwrap"><button class="back" data-nav="registry:'+p.id+'">← Вернуться в реестр</button><div class="mode"><button class="'+(mode==='explore'?'active':'')+'" data-mode="explore"><span class="ico">⌕</span><span><b>Исследую</b><small>Чтение и перепроверка</small></span></button><button class="'+(mode==='create'?'active':'')+'" data-mode="create"><span class="ico">⊞</span><span><b>Создаю</b><small>Редактор и материалы</small></span></button></div><section class="card '+(mode==='create'?'edit':'')+'"><div class="row"><span class="pill">'+(mode==='create'?'Редактирование':'Чтение')+' · '+(p.id==='pm-001'?'учебный пример':'исследование')+'</span><span class="pm">'+p.id.toUpperCase()+' / v'+p.version+'</span></div>'+(mode==='explore'?'<h1 class="title">'+esc(p.title)+'</h1><p class="claim">'+esc(p.claim)+'</p>'+statusPill(p)+'<div class="section"><h3>Граница вывода</h3><p>'+esc(p.boundary)+'</p></div>':'<h1 class="title" style="font-size:28px">Редактор карточки</h1><div class="editbox"><h2>Утверждение и границы</h2><div class="field"><label>Название</label><input id="editTitle" value="'+attr(v.title)+'"></div><div class="field"><label>Проверяемое утверждение</label><textarea id="editClaim">'+esc(v.claim)+'</textarea><div class="hint">После изменения прежний результат станет устаревшим.</div></div><div class="field"><label>Граница вывода</label><textarea id="editBoundary">'+esc(v.boundary)+'</textarea></div></div>')+'<div class="tabs"><button data-tab="materials" class="'+(tab==='materials'?'active':'')+'">Материалы</button><button data-tab="check" class="'+(tab==='check'?'active':'')+'">Проверка</button><button data-tab="report" class="'+(tab==='report'?'active':'')+'">Отчёт</button><button data-tab="history" class="'+(tab==='history'?'active':'')+'">История</button></div><div id="projectPanel" class="panel">'+panel(v,mode==='create')+'</div>'+(mode==='create'?'<div class="actions"><button class="btn primary wide" data-save>Сохранить новую версию</button><button class="btn" data-check>Проверить учебные трассы</button><button class="btn" data-counter>Добавить контрпример</button><button class="btn" data-snapshot>Файл для чтения</button><button class="btn" data-discard>Отменить правки</button><button class="btn wide" data-export>↓ JSON-копия проекта</button></div>':'<div class="toolbar"><button class="btn" data-check>Перепроверить учебные трассы</button><button class="btn" data-export>↓ JSON-копия проекта</button></div>')+'</section></section>'}
function download(name,text,type){var a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type:type}));a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},500)}
function snapshotHtml(p,include){var s=status(p),mh=include?active(p).map(function(m){return'<h3>'+esc(m.title)+'</h3><pre>'+esc(m.content)+'</pre>'}).join(''):'';return'<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(p.title)+' — ProofMesh</title><style>body{background:#f4f7fb;color:#07112f;font:16px/1.55 system-ui;margin:0}main{max-width:760px;margin:auto;padding:30px 18px}.c{background:#fff;border:1px solid #d8e2f2;border-radius:22px;padding:24px}pre{white-space:pre-wrap;background:#f7f9fc;padding:12px;border-radius:12px}</style><main><div class="c"><small>ProofMesh · снимок только для чтения</small><h1>'+esc(p.title)+'</h1><b>'+esc(meta[s][0])+'</b><h2>Утверждение</h2><p>'+esc(p.claim)+'</p><h2>Граница вывода</h2><p>'+esc(p.boundary)+'</p><h2>Результат</h2><p>'+esc(p.lastCheck?p.lastCheck.summary:meta[s][1])+'</p>'+(include?'<h2>Материалы</h2>'+mh:'<p><small>Материалы не включены.</small></p>')+'<hr><small>ProofMesh 0.3. Локальное исследование; снимок не содержит историю удалённых материалов.</small></div></main></html>'}
function saveVersion(p,label){var old={id:p.id,version:p.version,title:p.title,claim:p.claim,boundary:p.boundary,materials:clone(p.materials),lastCheck:clone(p.lastCheck),createdAt:p.createdAt,updatedAt:p.updatedAt};var hist=clone(p.history||[]);hist.unshift({version:p.version,at:now(),label:label,card:old});var n=clone(draft);n.version=p.version+1;n.history=hist.slice(0,30);n.createdAt=p.createdAt;n.updatedAt=now();var ix=ws.projects.findIndex(function(x){return x.id===p.id});ws.projects[ix]=n;draft=clone(n);draftId=p.id;save();return n}
function bind(){
document.querySelectorAll('[data-nav]').forEach(function(b){b.onclick=function(){nav(b.getAttribute('data-nav'))}});
document.querySelectorAll('[data-select]').forEach(function(b){b.onclick=function(){nav('registry:'+b.getAttribute('data-select'))}});
document.querySelectorAll('[data-clone]').forEach(function(b){b.onclick=function(){nav('new:'+b.getAttribute('data-clone'))}});
var form=document.getElementById('newForm');if(form)form.onsubmit=function(e){e.preventDefault();var fd=new FormData(form),id='pm-'+uid().slice(0,5);var p={id:id,version:1,title:String(fd.get('title')).trim(),claim:String(fd.get('claim')).trim(),boundary:String(fd.get('boundary')).trim(),materials:[],lastCheck:null,history:[],createdAt:now(),updatedAt:now()};var mt=String(fd.get('materialTitle')||'').trim(),mc=String(fd.get('materialContent')||'').trim();if(mt||mc)p.materials.push({id:uid(),kind:'events',title:mt||'Первый материал',content:mc});ws.projects.unshift(p);save();show('Исследование создано и появилось в реестре.');nav('project:'+id+':create')};
var r=parse(),p=find(r.id);
document.querySelectorAll('[data-mode]').forEach(function(b){b.onclick=function(){var m=b.getAttribute('data-mode');if(r.mode==='create'&&m==='explore'&&p&&dirty(p)&&!confirm('Есть несохранённые правки. Перейти без сохранения?'))return;if(m==='create'){draft=clone(p);draftId=p.id}nav('project:'+p.id+':'+m)}});
document.querySelectorAll('[data-tab]').forEach(function(b){b.onclick=function(){tab=b.getAttribute('data-tab');render()}});
if(r.screen==='project'&&p){
var et=document.getElementById('editTitle'),ec=document.getElementById('editClaim'),eb=document.getElementById('editBoundary');if(et)et.oninput=function(){draft.title=et.value};if(ec)ec.oninput=function(){draft.claim=ec.value};if(eb)eb.oninput=function(){draft.boundary=eb.value};
document.querySelectorAll('[data-add]').forEach(function(b){b.onclick=function(){var k=b.getAttribute('data-add');draft.materials.push({id:uid(),kind:k,title:k==='events'?'Новые учебные трассы':'Новая заметка',content:k==='events'?'Трасса N: init, pending, confirmed, retry':'Синтетическая заметка.'});render()}});
document.querySelectorAll('[data-mtitle]').forEach(function(i){i.oninput=function(){var m=draft.materials.find(function(x){return x.id===i.getAttribute('data-mtitle')});if(m)m.title=i.value}});
document.querySelectorAll('[data-mcontent]').forEach(function(i){i.oninput=function(){var m=draft.materials.find(function(x){return x.id===i.getAttribute('data-mcontent')});if(m)m.content=i.value}});
document.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(){var m=draft.materials.find(function(x){return x.id===b.getAttribute('data-del')});if(m)m.deleted=true;render()}});
document.querySelectorAll('[data-restorever]').forEach(function(b){b.onclick=function(){var v=p.history[+b.getAttribute('data-restorever')];draft=clone(v.card);draft.history=clone(p.history);draft.id=p.id;draftId=p.id;render();show('Версия загружена в редактор. Сохраните её как новую версию.')}});
var saveBtn=document.querySelector('[data-save]');if(saveBtn)saveBtn.onclick=function(){if(!dirty(p)){show('Изменений нет.');return}p=saveVersion(p,'Ручное сохранение правок');show('Новая версия сохранена.')};
var checkBtn=document.querySelector('[data-check]');if(checkBtn)checkBtn.onclick=function(){if(r.mode==='create'&&dirty(p))p=saveVersion(p,'Автосохранение перед проверкой');var ix=ws.projects.findIndex(function(x){return x.id===p.id});ws.projects[ix].lastCheck=runCheck(ws.projects[ix]);ws.projects[ix].updatedAt=now();draft=clone(ws.projects[ix]);draftId=p.id;save();tab='check';show('Учебная проверка завершена: '+meta[status(ws.projects[ix])][0]+'.');render()};
var counterBtn=document.querySelector('[data-counter]');if(counterBtn)counterBtn.onclick=function(){draft.materials.push({id:uid(),kind:'counter',title:'Контрпример: повтор в неоднозначном окне',content:'Трасса X: init, pending, retry, confirmed'});tab='materials';show('Контрпример добавлен. Запустите проверку.');render()};
var discard=document.querySelector('[data-discard]');if(discard)discard.onclick=function(){draft=clone(p);draftId=p.id;show('Несохранённые правки отменены.');render()};
var exp=document.querySelector('[data-export]');if(exp)exp.onclick=function(){download('proofmesh-'+p.id+'.json',JSON.stringify(p,null,2),'application/json')};
var snap=document.querySelector('[data-snapshot]');if(snap)snap.onclick=function(){var include=confirm('Включить активные материалы в файл для чтения?\nOK — включить. Отмена — без материалов.');download('proofmesh-'+p.id+'-readonly.html',snapshotHtml(p,include),'text/html');show('Файл для чтения подготовлен.')};
}}
function render(){var r=parse(),html=r.screen==='home'?home():r.screen==='registry'?registry(r.id):r.screen==='new'?newScreen(r.id):r.screen==='project'?research(r.id,r.mode):home();document.getElementById('app').innerHTML=html;bind()}
window.addEventListener('hashchange',function(){tab='materials';render()});
window.addEventListener('beforeunload',function(e){var r=parse(),p=find(r.id);if(r.screen==='project'&&r.mode==='create'&&p&&dirty(p)){e.preventDefault();e.returnValue=''}});
document.getElementById('restoreFile').onchange=function(){};
render();
})();
</script>
</body></html>
